<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="sans-serif" font-size="13">
<rect width="760" height="320" fill="#fff"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0L10,4L0,8z" fill="#c00"/></marker></defs>
<text x="20" y="25" font-size="16" font-weight="bold">Messprinzip: Biegung des Kurbelarms</text>
<circle cx="80" cy="170" r="30" fill="#ccc" stroke="#333"/><text x="80" y="174" text-anchor="middle" font-size="11">Achse</text>
<path d="M100,150 L380,160 L380,180 L100,190 z" fill="#bcd" stroke="#333"/>
<circle cx="390" cy="170" r="14" fill="#888" stroke="#333"/><text x="390" y="215" text-anchor="middle" font-size="11">Pedal</text>
<rect x="170" y="143" width="40" height="8" fill="#e80"/><rect x="230" y="145" width="40" height="8" fill="#e80"/>
<rect x="170" y="189" width="40" height="8" fill="#08c"/><rect x="230" y="187" width="40" height="8" fill="#08c"/>
<text x="220" y="135" text-anchor="middle" font-size="11">DMS 1, 2: gedehnt</text><text x="220" y="215" text-anchor="middle" font-size="11">DMS 3, 4: gestaucht</text>
<path d="M390,90V150" stroke="#c00" stroke-width="2.5" marker-end="url(#a)"/><text x="400" y="100" fill="#c00">F tangential</text>
<path d="M80,170H390" stroke="#555" stroke-dasharray="4,3"/><text x="235" y="250" text-anchor="middle">r = Kurbellänge, M = F · r</text>
<path d="M45,130 A55,55 0 0 1 120,118" fill="none" stroke="#c00" stroke-width="2" marker-end="url(#a)"/><text x="40" y="112" fill="#c00">ω (Gyro)</text>
<g transform="translate(500,70)">
<text x="100" y="0" text-anchor="middle" font-weight="bold">Vollbrücke</text>
<path d="M100,20 L170,100 L100,180 L30,100 z" fill="none" stroke="#333"/>
<text x="150" y="55">R1</text><text x="150" y="155">R3</text><text x="35" y="55">R4</text><text x="35" y="155">R2</text>
<text x="100" y="14" text-anchor="middle" font-size="11">+U</text><text x="100" y="198" text-anchor="middle" font-size="11">GND</text>
<path d="M30,100H0M170,100H200" stroke="#333"/><text x="100" y="105" text-anchor="middle" font-size="11">Δu → ADC</text>
