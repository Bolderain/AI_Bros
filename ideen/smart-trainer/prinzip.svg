<path d="M420,300 Q600,250 760,150" fill="none" stroke="#69c" stroke-width="2"/><text x="690" y="185">großer Spalt</text>
<path d="M420,300 Q560,200 720,80" fill="none" stroke="#c33" stroke-width="2"/><text x="640" y="80">kleiner Spalt</text>
<text x="430" y="345">Form der Kurven: Platzhalter (P), wird pro Trainer gemessen</text>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,8 L4,0 L8,8z"/></marker></defs>
