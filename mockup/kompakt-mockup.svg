<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#2f3b52"/>
      <stop offset="0.5" stop-color="#59708f"/>
      <stop offset="1" stop-color="#2f3b52"/>
    </linearGradient>
    <linearGradient id="pot2" x1="0" x2="1">
      <stop offset="0" stop-color="#a45f3a"/><stop offset="0.5" stop-color="#d08a5e"/><stop offset="1" stop-color="#a45f3a"/>
    </linearGradient>
    <linearGradient id="soil2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3626"/><stop offset="1" stop-color="#2d2117"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f5b942"/>
    </linearGradient>
  </defs>
  <rect width="960" height="640" fill="#f4f1ea"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#222">Pflanzenautomat, kompakte Version (semi-professionell)</text>
  <text x="30" y="62" font-size="13" fill="#555">Variante "Kompakt autark": ca. 40 x 40 x 150 mm, kleine Parfumflasche. Eigene Platine, LiPo, SMD-Sensoren. Wasser extern.</text>

  <rect x="30" y="560" width="900" height="22" fill="#d9d2c3" stroke="#b8ae9b"/>

  <!-- Topf -->
  <g>
    <path d="M250 430 L268 560 L470 560 L488 430 Z" fill="url(#pot2)" stroke="#7a4326" stroke-width="2"/>
    <rect x="243" y="416" width="252" height="16" rx="4" fill="#b86b43" stroke="#7a4326" stroke-width="2"/>
    <path d="M256 432 L272 552 L466 552 L482 432 Z" fill="url(#soil2)"/>
    <!-- Pflanze -->
    <path d="M370 432 C 360 360, 330 340, 315 300" stroke="#2f7d32" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M370 432 C 385 360, 420 340, 445 305" stroke="#2f7d32" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M370 432 C 372 370, 372 330, 376 285" stroke="#2f7d32" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="308" cy="298" rx="34" ry="17" fill="#3fa34d" transform="rotate(-35 308 298)"/>
    <ellipse cx="452" cy="300" rx="34" ry="17" fill="#3fa34d" transform="rotate(30 452 300)"/>
    <ellipse cx="378" cy="272" rx="32" ry="19" fill="#4cb85a"/>
  </g>

  <!-- Kompaktgerät als Stab -->
  <g>
    <!-- Spieß -->
    <path d="M500 432 L500 520 L512 540 L524 520 L524 432 Z" fill="#242424"/>
    <rect x="504" y="446" width="16" height="60" rx="3" fill="#7fb3d5"/>
    <!-- Körper -->
    <rect x="492" y="230" width="40" height="205" rx="14" fill="url(#body)" stroke="#1b2333" stroke-width="2"/>
    <!-- Solarzelle im Deckel -->
    <rect x="497" y="232" width="30" height="26" rx="5" fill="#12351f" stroke="#0a1f12"/>
    <line x1="502" y1="234" x2="502" y2="256" stroke="#1f6b3a" stroke-width="1"/>
    <line x1="507" y1="234" x2="507" y2="256" stroke="#1f6b3a" stroke-width="1"/>
    <line x1="512" y1="234" x2="512" y2="256" stroke="#1f6b3a" stroke-width="1"/>
    <line x1="517" y1="234" x2="517" y2="256" stroke="#1f6b3a" stroke-width="1"/>
    <line x1="522" y1="234" x2="522" y2="256" stroke="#1f6b3a" stroke-width="1"/>
    <!-- LED -->
    <circle cx="512" cy="272" r="3.5" fill="#5cff8a"/>
    <!-- Lüftungsschlitze Luftsensor -->
    <g stroke="#c8d4e2" stroke-width="1.4">
      <line x1="500" y1="286" x2="524" y2="286"/><line x1="500" y1="291" x2="524" y2="291"/><line x1="500" y1="296" x2="524" y2="296"/>
    </g>
    <!-- Schlauchanschluss (Wasser vom Kanister rein, Dünger dazu) -->
    <rect x="484" y="360" width="10" height="9" fill="#222"/>
    <!-- USB-C -->
    <rect x="506" y="428" width="12" height="5" rx="2" fill="#111"/>
  </g>

  <!-- Sonne / Solar -->
  <circle cx="700" cy="120" r="30" fill="url(#sun)"/>
  <g stroke="#f5b942" stroke-width="3">
    <line x1="700" y1="70" x2="700" y2="55"/><line x1="740" y1="90" x2="752" y2="80"/>
    <line x1="660" y1="90" x2="648" y2="80"/><line x1="748" y1="130" x2="762" y2="128"/>
  </g>
  <path d="M690 150 C 640 190, 560 210, 528 240" stroke="#f5b942" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <text x="600" y="180" font-size="11" fill="#b07d10">Solarzelle im Deckel lädt tagsüber</text>

  <!-- Funk -->
  <g fill="none" stroke="#e07a1f" stroke-width="2">
    <path d="M512 210 a 16 16 0 0 1 0 -0.1"/>
    <path d="M498 216 a 22 22 0 0 1 28 0"/>
    <path d="M490 206 a 34 34 0 0 1 44 0"/>
  </g>
  <text x="540" y="205" font-size="11" fill="#e07a1f">ESP-NOW / WLAN</text>

  <!-- Externe Pump-Dünger-Box am Kanister -->
  <g>
    <rect x="700" y="360" width="180" height="200" rx="10" fill="#e9eef2" stroke="#8aa0b0" stroke-width="2"/>
    <text x="712" y="382" font-size="12" fill="#333">Kanister + Ventilbox</text>
    <!-- Kanister -->
    <rect x="712" y="392" width="90" height="150" rx="8" fill="#dbe7ef" stroke="#8aa0b0"/>
    <rect x="716" y="470" width="82" height="68" rx="5" fill="#7fc4e6" opacity="0.85"/>
    <!-- Ventil -->
    <rect x="820" y="450" width="46" height="34" rx="5" fill="#333"/>
    <text x="826" y="471" font-size="9" fill="#fff">Ventil</text>
    <text x="712" y="556" font-size="9" fill="#666">Schwerkraft, bistabiles Ventil, kaum Strom</text>
  </g>
  <!-- Schlauch von Box zum Gerät -->
  <path d="M820 460 C 640 460, 560 400, 484 364" stroke="#3f8fbf" stroke-width="4" fill="none" stroke-dasharray="6 4"/>

  <!-- Massstab -->
  <g transform="translate(60 250)">
    <line x1="0" y1="0" x2="0" y2="185" stroke="#444" stroke-width="1.5"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#444" stroke-width="1.5"/>
    <line x1="-5" y1="185" x2="5" y2="185" stroke="#444" stroke-width="1.5"/>
    <text x="10" y="95" font-size="12" fill="#444">ca. 150 mm</text>
    <text x="10" y="112" font-size="10" fill="#777">Elektronikkörper</text>
  </g>

  <!-- Legende Bauteile im Gerät -->
  <g font-size="11" fill="#222">
    <text x="120" y="470">Im Stab, semi-professionell:</text>
    <text x="120" y="490">- eigene Platine 25 x 60 mm</text>
    <text x="120" y="508">- ESP32-C6-Modul, SHT40, BH1750 (SMD)</text>
    <text x="120" y="526">- LiPo 1000 mAh</text>
    <text x="120" y="544">- vergossener Sensorspieß</text>
  </g>
</svg>
