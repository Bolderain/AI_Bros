<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="tube" x1="0" x2="1">
      <stop offset="0" stop-color="#3d5a4a"/>
      <stop offset="0.5" stop-color="#6f8f7c"/>
      <stop offset="1" stop-color="#3d5a4a"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" x2="1">
      <stop offset="0" stop-color="#a45f3a"/>
      <stop offset="0.5" stop-color="#d08a5e"/>
      <stop offset="1" stop-color="#a45f3a"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3626"/>
      <stop offset="1" stop-color="#2d2117"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc4e6"/>
      <stop offset="1" stop-color="#3f8fbf"/>
    </linearGradient>
  </defs>

  <rect width="940" height="620" fill="#f4f1ea"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#222">Pflanzenautomat, Mockup Stufe 1</text>
  <text x="30" y="62" font-size="13" fill="#555">Gerät im Format einer 0,5-l-Flasche (ca. 27 cm x 7 cm), Wasserkanister getrennt. Maße nicht maßstabsgetreu.</text>

  <!-- Fensterbrett -->
  <rect x="30" y="540" width="880" height="24" fill="#d9d2c3" stroke="#b8ae9b"/>
  <text x="40" y="580" font-size="12" fill="#777">Fensterbrett</text>

  <!-- Wasserkanister -->
  <g>
    <rect x="70" y="330" width="150" height="210" rx="10" fill="#e9eef2" stroke="#8aa0b0" stroke-width="2"/>
    <rect x="76" y="420" width="138" height="114" rx="6" fill="url(#water)" opacity="0.85"/>
    <rect x="120" y="310" width="50" height="24" rx="4" fill="#8aa0b0"/>
    <!-- Tauchpumpe -->
    <rect x="100" y="495" width="40" height="30" rx="4" fill="#333"/>
    <text x="104" y="515" font-size="9" fill="#fff">Pumpe</text>
    <!-- Schwimmer -->
    <circle cx="190" cy="425" r="7" fill="#ffd166" stroke="#a37c00"/>
    <circle cx="190" cy="505" r="7" fill="#ffd166" stroke="#a37c00"/>
    <text x="80" y="355" font-size="12" fill="#333">Kanister 5 l</text>
    <text x="80" y="371" font-size="10" fill="#555">Schwimmer halb / leer</text>
  </g>

  <!-- Topf -->
  <g>
    <path d="M330 400 L350 540 L590 540 L610 400 Z" fill="url(#pot)" stroke="#7a4326" stroke-width="2"/>
    <rect x="322" y="386" width="296" height="18" rx="4" fill="#b86b43" stroke="#7a4326" stroke-width="2"/>
    <path d="M338 404 L352 530 L588 530 L602 404 Z" fill="url(#soil)"/>
    <!-- Untersetzer -->
    <path d="M340 540 L345 552 L595 552 L600 540 Z" fill="#8a4c2c"/>
    <!-- Pflanze -->
    <path d="M470 404 C 470 330, 440 300, 420 260" stroke="#2f7d32" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M470 404 C 480 320, 520 290, 545 250" stroke="#2f7d32" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M470 404 C 470 340, 470 300, 475 230" stroke="#2f7d32" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="410" cy="250" rx="42" ry="22" fill="#3fa34d" transform="rotate(-35 410 250)"/>
    <ellipse cx="555" cy="240" rx="42" ry="22" fill="#3fa34d" transform="rotate(30 555 240)"/>
    <ellipse cx="478" cy="215" rx="40" ry="24" fill="#4cb85a"/>
    <ellipse cx="440" cy="320" rx="34" ry="18" fill="#358f42" transform="rotate(-20 440 320)"/>
    <ellipse cx="515" cy="330" rx="34" ry="18" fill="#358f42" transform="rotate(20 515 330)"/>
    <!-- Tropfring -->
    <ellipse cx="470" cy="404" rx="95" ry="10" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="392" y="380" font-size="10" fill="#222">Tropfring</text>
  </g>

  <!-- Gerät -->
  <g>
    <!-- Spieß in Erde -->
    <path d="M598 404 L598 500 L612 520 L626 500 L626 404 Z" fill="#2b2b2b"/>
    <rect x="602" y="420" width="20" height="60" rx="3" fill="#7fb3d5"/>
    <text x="636" y="500" font-size="10" fill="#333">Feuchtesensor + DS18B20</text>
    <!-- Rohr -->
    <rect x="577" y="150" width="70" height="256" rx="14" fill="url(#tube)" stroke="#233" stroke-width="2"/>
    <!-- Abschnitte -->
    <line x1="577" y1="192" x2="647" y2="192" stroke="#1c2a22" stroke-width="1.5"/>
    <line x1="577" y1="250" x2="647" y2="250" stroke="#1c2a22" stroke-width="1.5"/>
    <line x1="577" y1="320" x2="647" y2="320" stroke="#1c2a22" stroke-width="1.5"/>
    <line x1="577" y1="366" x2="647" y2="366" stroke="#1c2a22" stroke-width="1.5"/>
    <!-- Kopf: Lüftungsschlitze, Lichtfenster, LED, USB-C -->
    <rect x="596" y="150" width="32" height="8" rx="4" fill="#dfe9e2"/>
    <circle cx="612" cy="176" r="4" fill="#5cff8a"/>
    <g stroke="#dfe9e2" stroke-width="1.5">
      <line x1="586" y1="168" x2="598" y2="168"/><line x1="586" y1="174" x2="598" y2="174"/><line x1="586" y1="180" x2="598" y2="180"/>
      <line x1="626" y1="168" x2="638" y2="168"/><line x1="626" y1="174" x2="638" y2="174"/><line x1="626" y1="180" x2="638" y2="180"/>
    </g>
    <!-- Schlauchanschlüsse -->
    <rect x="566" y="212" width="12" height="10" fill="#222"/>
    <rect x="646" y="212" width="12" height="10" fill="#222"/>
    <!-- Akku-Andeutung -->
    <rect x="596" y="262" width="32" height="48" rx="6" fill="#1c2a22" stroke="#9fb8aa"/>
    <text x="600" y="291" font-size="9" fill="#cfe">18650</text>
    <!-- Düngerflasche außen -->
    <rect x="650" y="322" width="26" height="42" rx="5" fill="#f2e394" stroke="#8a7a1a"/>
    <text x="652" y="347" font-size="8" fill="#5a4e00">NPK</text>
    <!-- Beschriftung Abschnitte -->
    <g font-size="11" fill="#222">
      <text x="690" y="175">Kopf: Luft T/rF, Licht, LED, USB-C</text>
      <text x="690" y="222">Elektronik: ESP32-C6, Boost, MOSFETs</text>
      <text x="690" y="290">Akku 18650, ca. 4 Wochen (Schätzung)</text>
      <text x="690" y="345">Dosierpumpe + Düngerflasche</text>
      <text x="690" y="392">Spieß, 8 cm in der Erde</text>
    </g>
    <g stroke="#888" stroke-width="1" stroke-dasharray="3 3">
      <line x1="648" y1="171" x2="686" y2="171"/>
      <line x1="648" y1="218" x2="686" y2="218"/>
      <line x1="648" y1="286" x2="686" y2="286"/>
      <line x1="678" y1="341" x2="686" y2="341"/>
      <line x1="630" y1="388" x2="686" y2="388"/>
    </g>
  </g>

  <!-- Schläuche -->
  <path d="M145 318 C 145 200, 400 200, 566 217" stroke="#3f8fbf" stroke-width="4" fill="none"/>
  <text x="300" y="192" font-size="10" fill="#3f8fbf">Schlauch vom Kanister (Wasser rein)</text>
  <path d="M658 217 C 700 217, 700 300, 620 402 C 600 410, 560 410, 470 414" stroke="#3f8fbf" stroke-width="4" fill="none" stroke-dasharray="6 4"/>
  <!-- Pumpenkabel -->
  <path d="M120 495 C 60 480, 60 260, 300 240 C 450 230, 560 210, 566 214" stroke="#222" stroke-width="1.5" fill="none"/>

  <!-- Funk -->
  <g fill="none" stroke="#e07a1f" stroke-width="2">
    <path d="M612 128 a 14 14 0 0 1 0 -0.1"/>
    <path d="M598 134 a 20 20 0 0 1 28 0"/>
    <path d="M590 124 a 32 32 0 0 1 44 0"/>
    <path d="M582 114 a 44 44 0 0 1 60 0"/>
  </g>
  <text x="640" y="120" font-size="11" fill="#e07a1f">WLAN / MQTT zur Zentrale</text>

  <!-- Legende Zentrale/Handy -->
  <g transform="translate(770 430)">
    <rect x="0" y="0" width="60" height="40" rx="4" fill="#c7d3dc" stroke="#6b7c88"/>
    <text x="8" y="24" font-size="10" fill="#222">Raspi</text>
    <rect x="90" y="-10" width="34" height="60" rx="6" fill="#222"/>
    <rect x="94" y="-4" width="26" height="46" rx="2" fill="#7fc4e6"/>
    <text x="0" y="62" font-size="10" fill="#333">Zentrale, Telegram + Dashboard</text>
    <line x1="60" y1="20" x2="90" y2="20" stroke="#6b7c88" stroke-dasharray="3 3"/>
  </g>
</svg>
