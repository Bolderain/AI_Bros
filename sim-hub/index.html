<title>AI Bros Simulatoren</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Werkbank: Reiterleiste oben, Simulator füllt den Rest */
:root{--bg:#eef1ef;--fg:#16201c;--muted:#5a6a63;--line:#c9d3ce;--card:#ffffff;--accent:#0e7a5a;
--disp:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--fg:#e4ece8;--muted:#93a69d;--line:#2a3833;--card:#18221e;--accent:#3fc496;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111815;--fg:#e4ece8;--muted:#93a69d;--line:#2a3833;--card:#18221e;--accent:#3fc496;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;gap:10px}
h1{font-family:var(--disp);font-size:1.6rem;margin:0;letter-spacing:.02em}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
header p{margin:0;color:var(--muted);font-size:.9rem}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{font:600 1.05rem var(--disp);letter-spacing:.03em;padding:6px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:4px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.info{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem;color:var(--muted)}
.info a{color:var(--accent)}
iframe{flex:1;min-height:70vh;width:100%;border:1px solid var(--line);border-radius:4px;background:var(--card)}
</style>
<header><h1>AI Bros Simulatoren</h1><p>Vier Ideen nachgerechnet. Alle Modellwerte sind Schätzungen oder Platzhalter (P), keine Messungen.</p></header>
<nav id="tabs" role="tablist"></nav>
<div class="info"><span id="desc"></span><a id="open" href="#" target="_blank" rel="noopener">Im eigenen Tab öffnen</a></div>
<iframe id="frame" title="Simulator"></iframe>
<script>
const S=[
 {id:"powermeter",n:"Powermeter",d:"Kurbelarm links, DMS-Vollbrücke: Messkette, Drift, Kalibrierung, Fehler durch 2 × links."},
 {id:"navi",n:"Gravel-Navi",d:"A gegen B: Energiebudget mit 10-h-Linie und GNSS-Fehler im Wald mit Off-Course-Warnung."},
 {id:"trainer",n:"Smart-Trainer",d:"Wirbelstrombremse mit Servo: ERG-Regler, Steigungsmodus, Scheibentemperatur, Workouts."},
 {id:"energie",n:"WG-Energie",d:"Virtuelle WG mit Zwischensteckern, Abdeckungsgrad, Flur-Anzeige, Funk aus dem Keller."}];
const tabs=document.getElementById("tabs"),fr=document.getElementById("frame");
function show(id){const s=S.find(x=>x.id===id)||S[0];const u=s.id+".html";fr.src=u;open.href=u;desc.textContent=s.d;
 [...tabs.children].forEach(b=>b.setAttribute("aria-selected",b.dataset.id===s.id));try{history.replaceState(null,"","#"+s.id)}catch(e){}}
S.forEach(s=>{const b=document.createElement("button");b.role="tab";b.dataset.id=s.id;b.textContent=s.n;b.onclick=()=>show(s.id);tabs.append(b)});
show(location.hash.slice(1));
</script>
